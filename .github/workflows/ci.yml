name: Voice and Vulkan validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Confirm Python analyzer is available
        run: python3 --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPython3_EXECUTABLE=$(command -v python3)
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run contracts and serialized-artifact gauntlet
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Upload synthetic fixture and test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fixture-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/fixture/
            build/Testing/Temporary/LastTest.log
          retention-days: 3
          if-no-files-found: warn

  sanitizers:
    name: Address and undefined-behavior checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DJALI_ENABLE_SANITIZERS=ON
          -DPython3_EXECUTABLE=$(command -v python3)
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Run sanitized contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure --no-tests=error

  native-backends:
    name: Native speech, Vulkan validation layers and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install platform speech and Vulkan development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools vulkan-validationlayers libespeak-ng-dev glslang-tools
      - name: Select software Vulkan and record actual runner resources
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/jali-xdg"
          chmod 700 "$RUNNER_TEMP/jali-xdg"
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/jali-xdg" >> "$GITHUB_ENV"
          echo "VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation" >> "$GITHUB_ENV"
          { uname -a; lscpu; free -h; df -h .; } | tee artifacts/runner-resources.txt
          echo "::notice title=Runner resources::CPUs=$(nproc); RAM=$(awk '/MemTotal/ {printf "%.1f GiB", $2/1048576}' /proc/meminfo); disk=$(df -h . | awk 'NR==2 {print $4}') free"
      - name: Record Vulkan device and validation layer inventory
        run: |
          vulkaninfo --summary 2>&1 | tee artifacts/vulkan-info.txt
          device=$(sed -n 's/.*deviceName *= *//p' artifacts/vulkan-info.txt | head -1)
          echo "::notice title=Vulkan device::$device (software driver selected)"
      - name: Install pinned Python image transport dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install pillow==11.3.0
      - name: Fetch the pinned self-contained glTF parser
        run: |
          mkdir -p .cache/deps
          curl -fL https://codeload.github.com/syoyo/tinygltf/tar.gz/refs/tags/v2.9.3 -o .cache/deps/tinygltf.tar.gz
          echo "c34443de2e9afaaf005713f69f5b061101a24ab2e9ee4021d882ac1d7983dbc0  .cache/deps/tinygltf.tar.gz" | sha256sum -c -
          tar -xzf .cache/deps/tinygltf.tar.gz -C .cache/deps
          npm ci --prefix tools --ignore-scripts
      - name: Configure real backends
        run: >-
          cmake -S . -B build-live -DCMAKE_BUILD_TYPE=Release
          -DJALI_ENABLE_ESPEAK=ON -DJALI_ENABLE_VULKAN=ON
          -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          -DTINYGLTF_INCLUDE_DIR="$PWD/.cache/deps/tinygltf-2.9.3"
      - name: Build
        run: cmake --build build-live --parallel 2
      - name: Test real PCM and Vulkan readback
        run: ctest --test-dir build-live --output-on-failure --no-tests=error --timeout 60
      - name: Exercise the full native CLI
        run: |
          timeout 60s ./build-live/jali_demo --voice espeak --renderer vulkan \
            --text "Hello from Jali." --size 128 --fps 12 --output artifacts/native-ci 2>&1 | tee artifacts/native-cli.log
          python3 tests/analyze_sync.py --audio artifacts/native-ci/session.wav \
            --curves artifacts/native-ci/face.csv --max-lag-ms 100
      - name: Verify hardware-required mode rejects the software driver
        run: |
          if timeout 30s ./build-live/jali_live --require-hardware --output artifacts/hardware-rejection > artifacts/hardware-rejection.log 2>&1; then
            echo "ERROR: Software Vulkan was accepted as hardware" >&2
            exit 1
          fi
          grep -i "hardware" artifacts/hardware-rejection.log
      - name: Exercise live Web Audio and native frames in Chromium
        run: .venv/bin/python tools/smoke_ci.py
      - name: Fail on Vulkan validation diagnostics
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('build-live/Testing/Temporary/LastTest.log'),
                   Path('artifacts/native-cli.log'), Path('artifacts/ci-preview.log')]
          paths += list(Path('artifacts').glob('*/engine.log'))
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(errors='replace')
              if re.search(r'Validation (?:Error|Warning|Performance Warning)|VUID-|UNASSIGNED-', text):
                  details = '\n'.join(line for line in text.splitlines() if re.search(r'Validation |VUID-|UNASSIGNED-', line))[:6000]
                  escaped = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Vulkan validation::{path}: {escaped}', flush=True)
                  raise SystemExit(f'Vulkan validation diagnostic in {path}')
          print('No Vulkan validation diagnostics found in native and browser test logs')
          PY
      - name: Upload built-in synthetic speech and native frame evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-backend-evidence
          path: |
            artifacts/native-ci/
            artifacts/native-cli.log
            artifacts/runner-resources.txt
            artifacts/vulkan-info.txt
            artifacts/ci-preview.log
            artifacts/ci-session.json
            artifacts/hardware-rejection.log
            artifacts/browser-check/
            artifacts/*/engine.log
            build-live/live-protocol/session.json
            build-live/Testing/Temporary/
          retention-days: 3
          if-no-files-found: warn

  neural-studio:
    name: Local neural speech, WebGL and articulation review
    # Never run model code on untrusted PRs. Standard hosted CPU runner, no GPU service.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/arena/3284941c-jali-vulkan')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Select Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Record actual hosted CPU resources
        run: |
          mkdir -p artifacts
          { uname -a; lscpu; free -h; df -h .; } > artifacts/neural-runner-resources.txt
      - name: Install pinned CPU dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements-neural-studio.txt
          npm ci --prefix tools --ignore-scripts
      - name: Install optional pinned phone-alignment crosscheck (no microphone)
        run: .venv/bin/python -m pip install --no-deps -r tools/requirements-alignment.txt
      - name: Check contracts without loading a neural model
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Explicitly prepare reviewed model, stock voice and CC0 character
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci_command.py .venv/bin/python tools/prepare_kokoro_cpu.py
          python tools/ci_command.py .venv/bin/python tools/build_neural_studio.py
      - name: Exercise actual neural synthesis, audio analysis and facial articulation
        run: .venv/bin/python tools/run_neural_ci.py
      - name: Crosscheck all actual corpus WAVs with two-pass phone alignment
        run: .venv/bin/python tools/align_neural_session.py --review artifacts/neural-review --output artifacts/neural-review/phone-alignment
      - name: Build and test the offline laptop playback checkpoint
        run: |
          .venv/bin/python tools/build_playback_checkpoint.py
          node tools/smoke_playback_checkpoint.cjs
      - name: Upload offline browser checkpoint (not a Windows backend)
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: laptop-playback-checkpoint
          path: |
            artifacts/Jali-Laptop-Playback-Checkpoint.zip
            artifacts/playback-checkpoint-proof/
          retention-days: 3
          if-no-files-found: error
      - name: Upload synthetic-only review evidence, never weights or caches
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: neural-articulation-review
          path: |
            artifacts/neural-review/
            artifacts/neural-studio/proof/
            artifacts/neural-runner-resources.txt
            artifacts/neural-ci-server.log
          retention-days: 3
          if-no-files-found: warn

  windows-playback:
    name: Windows Chrome offline playback (not local TTS)
    needs: neural-studio
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/arena/3284941c-jali-vulkan')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Download only the public synthetic playback artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: laptop-playback-checkpoint
          path: artifacts
      - name: Extract the playback pack
        shell: pwsh
        run: Expand-Archive -LiteralPath artifacts/Jali-Laptop-Playback-Checkpoint.zip -DestinationPath artifacts
      - name: Install pinned browser tooling without install hooks
        run: npm ci --prefix tools --ignore-scripts
      - name: Check sampler and measurement contracts on Windows
        run: node --test tests/visemes.test.mjs tests/measurement.test.mjs tests/performance.test.mjs
      - name: Exercise actual installed Chrome over HTTP and file URLs
        env:
          JALI_BROWSER_CHANNEL: chrome
        run: python tools/ci_command.py node tools/smoke_playback_checkpoint.cjs
      - name: Upload Windows browser-only evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-browser-playback-evidence
          path: artifacts/playback-checkpoint-proof/
          retention-days: 3
          if-no-files-found: warn

  windows-neural:
    name: Windows local neural speech, analyzer and live face
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/arena/3284941c-jali-vulkan')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      JALI_BROWSER_CHANNEL: chrome
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Python 3.11 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Select Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Record actual Windows runner inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @{os=(Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize);cpu=(Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors)} | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 artifacts/windows-neural-runner.json
      - name: Install pinned neural dependencies and browser tooling
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install -r tools/requirements-neural-studio.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix tools --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check cross-platform neural contracts without inference
        shell: pwsh
        run: |
          foreach ($pattern in @('test_neural*.py','test_local_neural.py','test_playback_checkpoint.py','test_benchmark.py','test_native_adapter.py','test_phone_alignment.py')) {
            .venv/Scripts/python.exe -m unittest discover -s tests -p $pattern
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --test tests/visemes.test.mjs tests/measurement.test.mjs tests/performance.test.mjs tests/streaming.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Explicitly prepare stock voice, model, Windows analyzer and CC0 head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/ci_command.py .venv/Scripts/python.exe tools/prepare_kokoro_cpu.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci_command.py .venv/Scripts/python.exe tools/build_neural_studio.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate three NEW Windows CPU recordings and animate their live face
        shell: pwsh
        run: python tools/ci_command.py .venv/Scripts/python.exe tools/run_neural_ci.py
      - name: Assert actual Windows CPU and analyzer measurements
        shell: pwsh
        run: |
          .venv/Scripts/python.exe tools/report_windows_neural.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the one-command Windows benchmark launcher
        shell: pwsh
        run: .\windows\benchmark.ps1 -Repeats 1 -Headless -Conditions 'Hosted Windows CI; not target laptop'
      - name: Build personal-only frozen CPU/WebGL app (no distributable artifact)
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci_command.py .venv/Scripts/python.exe tools/package_windows.py --personal-build --no-archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the frozen app with Python, Node and gh removed from its PATH
        shell: pwsh
        run: python tools/ci_command.py .venv/Scripts/python.exe tools/smoke_packaged.py
      - name: Upload public synthetic Windows evidence, never weights or caches
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-local-neural-evidence
          path: |
            artifacts/neural-review/
            artifacts/neural-studio/proof/
            artifacts/neural-ci-server.log
            artifacts/windows-neural-runner.json
            artifacts/windows-neural-summary.json
            artifacts/jali-benchmark-report.json
            artifacts/windows-portable/build-receipt.json
            artifacts/windows-portable/proof/*.json
            artifacts/windows-portable/proof/*.log
          retention-days: 3
          if-no-files-found: warn

  rich-native:
    name: Detailed human Vulkan, same-WAV native UI and source Three comparison
    needs: neural-studio
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/arena/3284941c-jali-vulkan')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Select Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install Vulkan build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools
          mkdir -p artifacts "$RUNNER_TEMP/jali-xdg"
          chmod 700 "$RUNNER_TEMP/jali-xdg"
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/jali-xdg" >> "$GITHUB_ENV"
          { uname -a; lscpu; free -h; } > artifacts/rich-runner-resources.txt
          python -m venv .venv
          .venv/bin/python -m pip install Pillow==11.1.0 imageio-ffmpeg==0.6.0
          npm ci --prefix tools --ignore-scripts
          mkdir -p .cache/deps
          curl -fL https://codeload.github.com/syoyo/tinygltf/tar.gz/refs/tags/v2.9.3 -o .cache/deps/tinygltf.tar.gz
          echo "c34443de2e9afaaf005713f69f5b061101a24ab2e9ee4021d882ac1d7983dbc0  .cache/deps/tinygltf.tar.gz" | sha256sum -c -
          tar -xzf .cache/deps/tinygltf.tar.gz -C .cache/deps
      - name: Download only verified public synthetic WAV/cue review recordings
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: neural-articulation-review
          path: artifacts
      - name: Explicitly prepare the decoded native head and comparison presentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci_command.py .venv/bin/python tools/prepare_native_ci.py
          node tools/validate_native_head.cjs artifacts/native-head/mpfb-native.glb artifacts/native-head/validation.json
      - name: Build and test expanded native importer and GPU ABI
        run: |
          cmake -S . -B build-live -DCMAKE_BUILD_TYPE=Release -DJALI_ENABLE_VULKAN=ON -DPython3_EXECUTABLE="$PWD/.venv/bin/python" -DTINYGLTF_INCLUDE_DIR="$PWD/.cache/deps/tinygltf-2.9.3"
          cmake --build build-live --parallel 2
          ctest --test-dir build-live --output-on-failure --timeout 60
      - name: Render actual speech, compare all source vertices and exercise native UI
        run: python tools/ci_command.py .venv/bin/python tools/run_native_ci.py
      - name: Reject Vulkan validation warnings or errors
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths=list(Path('artifacts/native-head-proof').glob('*.log'))+list(Path('artifacts/native-studio').glob('*.log'))+[Path('build-live/Testing/Temporary/LastTest.log')]
          for p in paths:
              if p.is_file() and re.search(r'Validation (?:Error|Warning|Performance Warning)|VUID-|UNASSIGNED-',p.read_text(errors='replace')):
                  raise SystemExit('Vulkan validation diagnostic: '+str(p))
          PY
      - name: Upload rendered evidence and metrics, never native model or weights
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: detailed-human-vulkan-evidence
          path: |
            artifacts/native-head-proof/*.json
            artifacts/native-head-proof/*.png
            artifacts/native-head-proof/*.mp4
            artifacts/native-head-proof/*.log
            artifacts/native-head/profile.json
            artifacts/native-head/validation.json
            artifacts/native-studio/*.log
            artifacts/rich-runner-resources.txt
          retention-days: 3
          if-no-files-found: warn
